name: Radar diário

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Correr o Radar
        env:
          CAPITAL: "1000"
          NTFY_TOPIC: radar-newporto-f5810b16
          APP_URL: https://newporto1.github.io/radar-app/
        run: python scripts/update.py
      - name: Gravar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Radar: dados $(date -u +%F)"
          git push

  publicar:
    needs: radar
    if: always() && needs.radar.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-app/docs
      - id: deploy
        uses: actions/deploy-pages@v4
