<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Crypto</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#16181d;--muted:#6b6f78;--line:#e6e3dc;
  --buy:#0f7b4d;--buy-bg:#e3f3ea;--sell:#b3261e;--sell-bg:#fbe7e5;--accent:#2f5bd3;--bar:#2f5bd3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--ink:#eceef2;--muted:#9097a3;--line:#262a32;
  --buy:#4cc38a;--buy-bg:#15291f;--sell:#ff7b72;--sell-bg:#2d1716;--accent:#7c9cff;--bar:#7c9cff;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px;font-weight:600}
.alert{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 7px;border-radius:6px;min-width:76px;text-align:center}
.tag.buy{color:var(--buy);background:var(--buy-bg)} .tag.sell{color:var(--sell);background:var(--sell-bg)}
.alert .txt{flex:1;min-width:0}
.alert .txt b{font-size:16px}
.alert .txt small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.buy{color:var(--buy)} .amt.sell{color:var(--sell)}
button.done{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;font:600 13px inherit;font-family:inherit;cursor:pointer}
button.done:active{transform:scale(.97)}
.alert.is-done{opacity:.55}
.alert.is-done button.done{border-color:transparent;color:var(--buy)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.coin{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.coin:last-child{border-bottom:0}
.coin .sym{font-weight:700}
.coin .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.coin .fill{height:100%;background:var(--bar);border-radius:3px}
.coin .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.coin .meta{grid-column:2/4;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.coin.zero .sym,.coin.zero .val{color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.up{color:var(--buy)} .down{color:var(--sell)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:8px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
footer button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px}
.err{background:var(--sell-bg);color:var(--sell);padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Radar</h1><div class="sub" id="asof">A carregar…</div></div>
    <span class="pill" id="ver">—</span>
  </header>
  <div id="err"></div>
  <section class="kpis">
    <div class="kpi"><b id="k-inv">—</b><span>investido</span></div>
    <div class="kpi"><b id="k-cap">—</b><span>capital</span></div>
    <div class="kpi"><b id="k-n">—</b><span>moedas</span></div>
  </section>

  <h2>Por fazer</h2>
  <div id="todo"></div>

  <h2>Carteira-alvo</h2>
  <div class="card" id="coins"></div>

  <h2>Histórico</h2>
  <details><summary id="hist-sum">Ver alertas anteriores</summary><div id="hist"></div></details>

  <footer>
    <div id="gen"></div>
    <div>Executas as ordens à mão na Binance. «Feito» fica guardado neste dispositivo.</div>
    <button id="reload">Atualizar</button>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const fmtEur = x => Math.round(Math.abs(x)).toLocaleString('pt-PT') + ' €';
const fmtUsd = x => (x >= 1000 ? Math.round(x).toLocaleString('pt-PT') : x.toLocaleString('pt-PT',{maximumSignificantDigits:4})) + ' $';
const fmtPct = (x,d=0) => (x*100).toLocaleString('pt-PT',{maximumFractionDigits:d}) + '%';
const fmtDay = iso => new Date(iso).toLocaleDateString('pt-PT',{day:'numeric',month:'short'});
const fmtDT = iso => new Date(iso).toLocaleString('pt-PT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let done = {};
try { done = JSON.parse(localStorage.getItem('radar_done') || '{}'); } catch(e) {}
const saveDone = () => { try { localStorage.setItem('radar_done', JSON.stringify(done)); } catch(e) {} };

function alertRow(a){
  const buy = a.delta_eur > 0, isDone = !!done[a.id];
  const verb = buy ? 'Comprar' : 'Vender';
  const detail = a.type === 'ABRIR' ? `${verb} · preço ~${fmtUsd(a.price)}`
    : `${verb} · alvo ${fmtEur(a.to_eur)} (era ${fmtEur(a.from_eur)})`;
  return `<div class="alert ${isDone?'is-done':''}">
    <span class="tag ${buy?'buy':'sell'}">${esc(a.type)}</span>
    <div class="txt"><b>${esc(a.sym)}</b> <span class="amt ${buy?'buy':'sell'}">${buy?'+':'−'}${fmtEur(a.delta_eur)}</span>
      <small>${detail} · ${fmtDay(a.as_of)}</small></div>
    <button class="done" data-id="${esc(a.id)}">${isDone?'✓ Feito':'Feito'}</button></div>`;
}

function render(state, alerts){
  $('asof').textContent = 'Dados até ' + fmtDT(state.as_of);
  $('ver').textContent = 'algoritmo ' + (state.version || 'v2');
  $('k-inv').textContent = fmtPct(state.invested);
  $('k-cap').textContent = fmtEur(state.capital);
  const held = state.coins.filter(c => c.weight >= 0.005);
  $('k-n').textContent = held.length;
  $('gen').textContent = 'Calculado ' + fmtDT(state.generated);

  alerts.sort((a,b) => b.as_of.localeCompare(a.as_of) || Math.abs(b.delta_eur) - Math.abs(a.delta_eur));
  const pending = alerts.filter(a => !done[a.id]);
  const past = alerts.filter(a => done[a.id]);
  $('todo').innerHTML = pending.length ? pending.map(alertRow).join('')
    : '<div class="empty">Nada por fazer. A carteira está alinhada com o alvo.</div>';
  $('hist-sum').textContent = past.length ? `Ver alertas feitos (${past.length})` : 'Ainda não há alertas feitos';
  $('hist').innerHTML = past.map(alertRow).join('');

  const max = Math.max(...state.coins.map(c => c.weight), 0.01);
  $('coins').innerHTML = [...state.coins].sort((a,b) => b.weight - a.weight || b.score - a.score).map(c => {
    const z = c.weight < 0.005;
    return `<div class="coin ${z?'zero':''}">
      <span class="sym">${esc(c.sym)}</span>
      <div class="track"><div class="fill" style="width:${(c.weight/max*100).toFixed(1)}%"></div></div>
      <span class="val">${z ? '—' : fmtEur(c.eur)}</span>
      <div class="meta"><span>${z ? 'fora' : fmtPct(c.weight,1)} · score ${c.score.toFixed(2)}</span>
        <span>${fmtUsd(c.price)} · <span class="${c.chg7d>=0?'up':'down'}">${c.chg7d>=0?'+':''}${fmtPct(c.chg7d,1)}</span> 7d</span></div>
    </div>`;
  }).join('');
}

let cache = null;
async function load(){
  $('err').innerHTML = '';
  try {
    const t = Date.now();
    const [s, a] = await Promise.all([
      fetch('data/state.json?t=' + t, {cache:'no-store'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/alerts.json?t=' + t, {cache:'no-store'}).then(r => r.ok ? r.json() : [])
    ]);
    cache = [s, a]; render(s, a);
  } catch(e) {
    $('err').innerHTML = '<div class="err">Não consegui carregar os dados. Verifica a ligação e toca em «Atualizar».</div>';
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.done');
  if (b) { const id = b.dataset.id; if (done[id]) delete done[id]; else done[id] = new Date().toISOString(); saveDone(); if (cache) render(...cache); }
});
$('reload').onclick = load;
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
